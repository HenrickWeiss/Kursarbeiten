<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kursarbeiten</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fa;--card:#fff;--text:#1b1f2a;--muted:#8a90a2;--line:#e6e8f0;--done:#22c55e;--todo:#6366f1;--track:#e9ebf3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--text:#eef0f6;--muted:#7d8497;--line:#262a37;--done:#34d399;--todo:#818cf8;--track:#222633}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--text:#eef0f6;--muted:#7d8497;--line:#262a37;--done:#34d399;--todo:#818cf8;--track:#222633}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.card:nth-of-type(2){animation-delay:.08s}.card:nth-of-type(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chart{display:flex;align-items:center;gap:22px}
.chart>svg{width:150px;height:150px;flex:none;transform:rotate(-90deg);border-radius:50%}
.del svg,.edit svg{display:block}
circle{fill:none;stroke-width:32;transition:stroke-dasharray .9s cubic-bezier(.3,.8,.2,1),stroke-dashoffset .9s cubic-bezier(.3,.8,.2,1)}
.legend{flex:1}
.pct{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.pct small{font-size:18px;color:var(--muted);font-weight:500}
.lab{color:var(--muted);font-size:13px;margin:4px 0 14px}
.row{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:6px}
.dot{width:10px;height:10px;border-radius:50%}
form{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=date],textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--todo);box-shadow:0 0 0 3px color-mix(in srgb,var(--todo) 22%,transparent)}
input[type=text]{flex:1 1 180px;min-width:0}
input[type=date]{flex:1 1 130px}
textarea{flex:1 1 100%;resize:vertical;min-height:64px}
button.add{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;background:var(--todo);color:#fff;cursor:pointer;transition:transform .15s,filter .2s}
button.add:hover{filter:brightness(1.08)}button.add:active{transform:scale(.95)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line);animation:in .45s cubic-bezier(.2,.8,.2,1) both;transition:opacity .3s,transform .3s}
li:last-child{border-bottom:0}
li.out{opacity:0;transform:translateX(30px)}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.chk{margin-top:1px;appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;cursor:pointer;display:grid;place-items:center;transition:background .25s,border-color .25s}
.chk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.chk:checked{background:var(--done);border-color:var(--done);animation:pop .35s}
.chk:checked::after{transform:rotate(45deg) scale(1)}
@keyframes pop{50%{transform:scale(1.2)}}
.t{flex:1;min-width:0}
.name{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.3;transition:color .3s;position:relative;display:inline-block;word-break:break-word}
.name::after{content:"";position:absolute;left:0;top:55%;height:2px;width:100%;background:var(--muted);transform:scaleX(0);transform-origin:left;transition:transform .35s}
li.done .name{color:var(--muted)}li.done .name::after{transform:scaleX(1)}
.date{font-size:12px;color:var(--muted);margin-top:2px}
.del,.edit{align-self:center;flex:none;width:40px;height:40px;display:grid;place-items:center;line-height:1;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:color .2s,background .2s}
.del:hover{color:#ef4444;background:var(--bg)}
.head{display:flex;align-items:center;gap:6px;outline:none}
.head.has{cursor:pointer}
.head.has:focus-visible .name{text-decoration:underline}
.chev{width:7px;height:7px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin:-3px 0 0 4px;transition:transform .3s,margin .3s}
.head[aria-expanded=true] .chev{transform:rotate(-135deg);margin-top:3px}
.acc{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.3,.8,.2,1),opacity .3s}
.acc.open{grid-template-rows:1fr;opacity:1}
.acc>div{overflow:hidden;min-height:0}
.fl{display:grid;gap:7px;padding-top:10px}
.fi{display:block;position:relative;padding-left:20px;font-size:14px;line-height:1.4}
.fi::before{content:"";position:absolute;left:5px;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--todo)}
.edit:hover{color:var(--todo);background:var(--bg)}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:rgba(10,12,20,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.dlg{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;transform:translateY(14px) scale(.97);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ov.show .dlg{transform:none}
.dlg h2{margin:0 0 6px;font-size:19px}
.dlg p{margin:0 0 16px;color:var(--muted);font-size:14px}
.dlg form input,.dlg form textarea{flex:1 1 100%}
.dlg textarea{min-height:110px}
.btns{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:4px}
.btn{font:inherit;font-weight:600;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.95)}
.btn.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.btn.pri{background:var(--todo);border-color:var(--todo);color:#fff}
.empty{text-align:center;color:var(--muted);padding:22px 0 8px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Kursarbeiten</h1>
  <p class="sub">Trag ein, was ansteht – und hak ab, was geschafft ist.</p>

  <section class="card chart">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="16" pathLength="100" stroke="var(--track)" stroke-dasharray="100 100"/>
      <circle id="todoC" cx="32" cy="32" r="16" pathLength="100" stroke="var(--todo)" stroke-dasharray="0 100"/>
      <circle id="doneC" cx="32" cy="32" r="16" pathLength="100" stroke="var(--done)" stroke-dasharray="0 100"/>
    </svg>
    <div class="legend">
      <div class="pct"><span id="pct">0</span><small>%</small></div>
      <div class="lab">geschrieben</div>
      <div class="row"><span class="dot" style="background:var(--done)"></span><span id="nDone">0</span>&nbsp;geschrieben</div>
      <div class="row"><span class="dot" style="background:var(--todo)"></span><span id="nTodo">0</span>&nbsp;offen</div>
    </div>
  </section>

  <section class="card">
    <form id="f">
      <input type="text" id="n" placeholder="Fach, z. B. Mathe" maxlength="60" required autocomplete="off">
      <input type="date" id="d" aria-label="Datum">
      <textarea id="fo" placeholder="Schwerpunkte (optional, mit Komma oder Zeilenumbruch trennen)" maxlength="600"></textarea>
      <button class="add" type="submit">Hinzufügen</button>
    </form>
  </section>

  <section class="card">
    <ul id="list"></ul>
    <div class="empty" id="empty">Noch keine Kursarbeiten eingetragen.</div>
  </section>
</main>

<div class="ov" id="delDlg"><div class="dlg" role="dialog" aria-modal="true">
  <h2>Wirklich löschen?</h2>
  <p>„<span id="delName"></span>“ wird entfernt.</p>
  <div class="btns"><button type="button" class="btn danger" id="delYes">Ja</button><button type="button" class="btn" id="delNo">Nein</button><button type="button" class="btn" id="delAlways">Ja, nicht wieder fragen</button></div>
</div></div>

<div class="ov" id="editDlg"><div class="dlg" role="dialog" aria-modal="true">
  <h2>Bearbeiten</h2>
  <form id="editForm">
    <input type="text" id="en" placeholder="Fach" maxlength="60" required autocomplete="off">
    <input type="date" id="ed" aria-label="Datum">
    <textarea id="ef" placeholder="Schwerpunkte (Komma oder Zeilenumbruch)" maxlength="600"></textarea>
    <div class="btns"><button class="btn pri" type="submit">Speichern</button><button type="button" class="btn" id="editCancel">Abbrechen</button></div>
  </form>
</div></div>

<script>
const KEY="kursarbeiten-v1";
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
if(!Array.isArray(items))items=[];
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const fmt=d=>d?new Date(d+"T00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"long",year:"numeric"}):"";
let shown=0,raf;
function countTo(el,to){
  cancelAnimationFrame(raf);const from=shown,t0=performance.now();
  (function s(t){const k=Math.min(1,(t-t0)/800),e=1-Math.pow(1-k,3);
    shown=Math.round(from+(to-from)*e);el.textContent=shown;if(k<1)raf=requestAnimationFrame(s)})(t0);
}
function chart(){
  const n=items.length,d=items.filter(i=>i.done).length;
  const p=n?d/n*100:0;
  $("doneC").setAttribute("stroke-dasharray",p+" 100");
  $("todoC").setAttribute("stroke-dasharray",(n?100-p:0)+" 100");
  $("todoC").setAttribute("stroke-dashoffset",-p);
  $("nDone").textContent=d;$("nTodo").textContent=n-d;
  countTo($("pct"),Math.round(p));
}
function sorted(){
  return [...items].sort((a,b)=>a.done-b.done||(a.date||"9").localeCompare(b.date||"9")||a.id-b.id);
}
const known=new Set(),open=new Set();
const XI='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const PI='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
let skipAsk=false;try{skipAsk=localStorage.getItem(KEY+"-noask")==="1"}catch(e){}
const show=(id,on)=>$(id).classList.toggle("show",on);
function doDelete(it,li){li.classList.add("out");setTimeout(()=>{items=items.filter(i=>i.id!==it.id);open.delete(it.id);save();render();chart()},300)}
let pend=null;
function askDelete(it,li){if(skipAsk){doDelete(it,li);return}pend={it,li};$("delName").textContent=it.name;show("delDlg",true)}
$("delNo").onclick=()=>show("delDlg",false);
$("delYes").onclick=()=>{show("delDlg",false);if(pend)doDelete(pend.it,pend.li);pend=null};
$("delAlways").onclick=()=>{skipAsk=true;try{localStorage.setItem(KEY+"-noask","1")}catch(e){}$("delYes").onclick()};
let editing=null;
function openEdit(it){editing=it;$("en").value=it.name;$("ed").value=it.date||"";$("ef").value=(it.focus||[]).join("\n");show("editDlg",true);setTimeout(()=>$("en").focus(),60)}
$("editCancel").onclick=()=>show("editDlg",false);
$("editForm").onsubmit=e=>{e.preventDefault();const n=$("en").value.trim();if(!n||!editing)return;editing.name=n;editing.date=$("ed").value;editing.focus=parseFocus($("ef").value);save();show("editDlg",false);render()};
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("show")}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".ov").forEach(o=>o.classList.remove("show"))});
const parseFocus=s=>s.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean).slice(0,30);
function render(){
  const ul=$("list");ul.innerHTML="";
  sorted().forEach(it=>{
    const li=document.createElement("li");
    li.className=it.done?"done":"";
    if(known.has(it.id))li.style.animation="none";
    known.add(it.id);
    const c=document.createElement("input");c.type="checkbox";c.className="chk";c.checked=it.done;
    c.setAttribute("aria-label",it.name+" geschrieben");
    c.onchange=()=>{it.done=c.checked;li.classList.toggle("done",it.done);save();chart();setTimeout(render,450)};
    const t=document.createElement("div");t.className="t";
    const head=document.createElement("div");head.className="head";
    const nm=document.createElement("span");nm.className="name";nm.textContent=it.name;
    head.appendChild(nm);t.appendChild(head);
    if(it.date){const dd=document.createElement("div");dd.className="date";dd.textContent=fmt(it.date);t.appendChild(dd)}
    const fo=it.focus||[];
    if(fo.length){
      const isOpen=open.has(it.id);
      head.classList.add("has");head.tabIndex=0;head.setAttribute("role","button");head.setAttribute("aria-expanded",isOpen);
      const ch=document.createElement("span");ch.className="chev";head.appendChild(ch);
      const acc=document.createElement("div");acc.className="acc"+(isOpen?" open":"");
      const inn=document.createElement("div");const chips=document.createElement("div");chips.className="fl";
      fo.forEach(s=>{const chip=document.createElement("span");chip.className="fi";chip.textContent=s;chips.appendChild(chip)});
      inn.appendChild(chips);acc.appendChild(inn);t.appendChild(acc);
      const tog=()=>{const o=!acc.classList.contains("open");acc.classList.toggle("open",o);head.setAttribute("aria-expanded",o);o?open.add(it.id):open.delete(it.id)};
      head.onclick=tog;head.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}};
    }
    const x=document.createElement("button");x.className="del";x.innerHTML=XI;x.setAttribute("aria-label","Löschen");
    x.onclick=()=>askDelete(it,li);
    const ed=document.createElement("button");ed.className="edit";ed.innerHTML=PI;ed.setAttribute("aria-label","Bearbeiten");ed.onclick=()=>openEdit(it);
    li.append(c,t,ed,x);ul.appendChild(li);
  });
  $("empty").style.display=items.length?"none":"block";
}
$("f").onsubmit=e=>{
  e.preventDefault();
  const name=$("n").value.trim();if(!name)return;
  items.push({id:Date.now(),name,date:$("d").value,focus:parseFocus($("fo").value),done:false});
  $("n").value="";$("d").value="";$("fo").value="";save();render();chart();$("n").focus();
};
render();
setTimeout(chart,250);
</script>
</body>
</html>
